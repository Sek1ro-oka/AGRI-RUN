plugins {
    alias(libs.plugins.android.application)
}

// 本地签名：keystore.properties 与本机 keystore 都已被 .gitignore 排除，不会入库。
// 没有这两个文件时 release 变体保持未签名（Gradle 会产出 -unsigned.apk），构建不会因此失败。
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def hasLocalKeystore = keystorePropertiesFile.exists()
        && keystoreProperties['storeFile'] != null
        && rootProject.file(keystoreProperties['storeFile']).exists()

// 高德 Key：优先命令行 -PamapKey=...，其次 local.properties 的 amapKey=...，都没有就留空。
// 这样 Key 不会进仓库，也不影响没有 Key 的构建。
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def amapKey = (project.findProperty('amapKey') ?: localProperties.getProperty('amapKey') ?: '').trim()

android {
    namespace 'org.localroute.app'
    compileSdk 35

    defaultConfig {
        applicationId 'org.localroute.app'
        minSdk 29
        targetSdk 35
        versionCode 9
        versionName '0.2.2'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        // 不想被语言分包影响：本项目只有中文资源
        resourceConfigurations += ['zh', 'en']
        // MapLibre 的原生库同时带 arm 与 x86；正式包只留真机需要的两种 ARM ABI，减小体积。
        // 模拟器用的 x86_64 只在 debug 里启用（见 buildTypes.debug）。
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        // 高德 Key 走 local.properties 的 amapKey=...（不进仓库、不写死在源码里）。
        // 没有配置时留空字符串，界面据此提示「未配置 Key，仍用栅格瓦片」。
        buildConfigField 'String', 'AMAP_KEY', "\"${amapKey}\""
        // 高德 SDK 要求 manifest 里挂 com.amap.api.v2.apikey；用占位符注入，源码不出现明文。
        manifestPlaceholders = [amapKey: amapKey]
    }

    signingConfigs {
        if (hasLocalKeystore) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            applicationIdSuffix '.debug'
            // 调试包与正式包包名不同，可以同时安装，便于对照排查。
            // 额外带上 x86_64：本机用 AVD 模拟器做实测，ARM 包装不进 x86 模拟器。
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            }
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasLocalKeystore) {
                signingConfig signingConfigs.release
            }
            // 未检测到本地 keystore 时 release 变体未签名，构建仍可完成；
            // 安装与分发说明见 docs/BUILD.md「签名」一节。
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        // 需要 BuildConfig.AMAP_KEY（见 defaultConfig 的 buildConfigField）
        buildConfig true
    }

    testOptions {
        unitTests {
            includeAndroidResources = false
            returnDefaultValues = false
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds false
        warningsAsErrors false
        htmlReport true
        xmlReport true
        textReport true
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    implementation project(':route-core')
    implementation project(':simulation-core')

    implementation libs.androidx.appcompat
    implementation libs.androidx.lifecycle.viewmodel
    implementation libs.androidx.lifecycle.livedata
    implementation libs.google.material
    implementation libs.maplibre.android
    // 高德官方 3D SDK：只有 Key + arm 架构时才真正启用（MapBackendPolicy 判定），否则走栅格瓦片。
    implementation "com.amap.api:3dmap:10.0.600"

    testImplementation libs.junit
    // 仅测试用：为 JVM 单元测试提供与 Android 平台同 API 的 org.json 参考实现
    testImplementation libs.org.json.reference

    androidTestImplementation libs.androidx.test.core
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.rules
    androidTestImplementation libs.espresso.core
}
