# Gradle / JVM
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Java 工具链固定为 17（Gradle 由 JDK 17+ 运行，见 docs/environment.md）
org.gradle.java.installations.auto-download=false

# AndroidX
android.useAndroidX=true
# 项目位于含中文的路径（E:\农林快跑\route-workshop）。AGP 默认拒绝非 ASCII 路径，
# 本项目为纯 Java、无 NDK、无 aapt 压缩资源路径处理需求，已在 Windows 上实测构建通过；
# 若换用其他构建机出现路径相关失败，请把仓库移动到纯 ASCII 路径后再构建（见 docs/BUILD.md）。
android.overridePathCheck=true
android.nonTransitiveRClass=true
# 只使用显式声明的 BuildConfig 字段（本项目不依赖 BuildConfig）
android.defaults.buildfeatures.buildconfig=false
