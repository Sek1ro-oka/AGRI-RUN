# Gradle / JVM
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Java 工具链固定为 17（Gradle 由 JDK 17+ 运行，见 docs/environment.md）
org.gradle.java.installations.auto-download=false

# AndroidX
android.useAndroidX=true
# 工程已放到纯 ASCII 路径（E:\agri-run\route-workshop），不再需要 android.overridePathCheck。
# 历史上工程在含中文的路径下时曾用该开关兜底，现已移除，避免掩盖真正的路径问题（见 docs/BUILD.md）。
android.nonTransitiveRClass=true
# 只使用显式声明的 BuildConfig 字段（本项目不依赖 BuildConfig）
android.defaults.buildfeatures.buildconfig=false
