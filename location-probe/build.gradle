plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'org.localroute.probe'
    compileSdk 35

    defaultConfig {
        applicationId 'org.localroute.probe'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        // 独立包名、独立进程：用于从系统 LocationManager 独立读取位置，
        // 不读取主 App 的任何内存状态（任务书第 12 步）。
        resourceConfigurations += ['zh', 'en']
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig false
    }

    lint {
        abortOnError true
        checkReleaseBuilds false
    }
}

dependencies {
    implementation libs.androidx.appcompat
    implementation libs.google.material
    implementation project(':simulation-core')
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
